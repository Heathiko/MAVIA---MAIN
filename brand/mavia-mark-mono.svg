<!--
  One-colour version, for places that cannot take the blue: a stamp, an
  embossed cover, a dark UI, a fax of a permission form. `currentColor` means
  it inherits whatever colour it is dropped into.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MAVIA">
  <title>MAVIA</title>
  <circle cx="256" cy="256" r="248" fill="none" stroke="currentColor" stroke-width="16"/>
  <g fill="currentColor">
    <circle cx="190" cy="148" r="46"/>
    <circle cx="322" cy="148" r="46"/>
    <circle cx="190" cy="364" r="46"/>
  </g>
</svg>
