<!--
  MAVIA mark — the cell read as progress.

  Braille M again, but the four blank positions are drawn as open rings rather
  than left empty. The whole cell is then visible, and it reads twice: the
  letter M to anyone who reads braille, and three of six done to anyone who
  does not -- which is what a learner's path through a topic looks like.

  The open rings are the risk here: they are the first thing to disappear at
  16px. Use this one where it is drawn large.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MAVIA">
  <title>MAVIA</title>
  <circle cx="256" cy="256" r="256" fill="#1D5FD6"/>
  <g fill="#FFFFFF">
    <circle cx="190" cy="148" r="46"/>
    <circle cx="322" cy="148" r="46"/>
    <circle cx="190" cy="364" r="46"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="12" opacity="0.42">
    <circle cx="190" cy="256" r="40"/>
    <circle cx="322" cy="256" r="40"/>
    <circle cx="322" cy="364" r="40"/>
  </g>
</svg>
