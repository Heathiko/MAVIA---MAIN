<!--
  MAVIA mark — M drawn as a signal.

  The letter M is already the shape of a waveform: peak, trough, peak. Drawn
  as one thick rounded stroke it reads both ways at once -- the initial, and
  the trace of a voice, which is the only form a MAVIA lesson ever takes for
  the person using it.

  Nothing is added to make the joke work. It is the letter, drawn the way an
  audio app would draw anything.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MAVIA">
  <title>MAVIA</title>
  <circle cx="256" cy="256" r="256" fill="#1D5FD6"/>
  <path d="M152 368 L152 168 L256 288 L360 168 L360 368"
        fill="none" stroke="#FFFFFF" stroke-width="44"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
