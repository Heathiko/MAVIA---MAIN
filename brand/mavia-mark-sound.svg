<!--
  Variant: the braille cell with sound leaving it.

  Same three dots, plus two arcs from the cell's open right-hand side. MAVIA
  is heard before it is touched -- every lesson is read aloud -- so the mark
  says both: the letter in the app's own alphabet, and the fact that it
  speaks. The arcs sit where dots 5 and 6 would be, so the cell still reads
  as a cell rather than as a shape with decoration beside it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MAVIA">
  <title>MAVIA</title>
  <circle cx="256" cy="256" r="256" fill="#1D5FD6"/>
  <g fill="#FFFFFF">
    <circle cx="180" cy="148" r="44"/>
    <circle cx="306" cy="148" r="44"/>
    <circle cx="180" cy="364" r="44"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" opacity="0.85">
    <path d="M296 292 a58 58 0 0 1 0 84"/>
    <path d="M356 262 a104 104 0 0 1 0 144"/>
  </g>
</svg>
