<!--
  MAVIA mark — the braille cell that draws its own letter.

  Braille M is dots 1, 3 and 4. The V runs between the two raised dots at the
  top, so the left column reads as the letter's stem and the V as its middle:
  M to a sighted eye, a correct braille M under a finger, and no shape added
  that the cell did not already have a position for.

  Drawn loose on purpose. The first version of this was tight and awkward for
  three reasons, all fixed here:

    - The V had to squeeze past the open rings at positions 2 and 5. Those
      rings are gone, so the V drops into empty space instead of threading a
      gap. The 2-by-3 footprint still reads as a cell from the three dots.
    - Everything sat in a small cluster inside a large disc. The cell is wider
      and taller now (184 apart, not 160) and the dots are bigger, so the mark
      fills the circle rather than floating in the middle of it.
    - The stroke was thinner than the dots were wide, which made the V look
      like a different object that had wandered in. At 36 against a 50 radius
      it now reads as the same hand.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MAVIA">
  <title>MAVIA</title>
  <circle cx="256" cy="256" r="256" fill="#1D5FD6"/>

  <!-- The V, behind the dots so they stay whole circles. -->
  <path d="M164 146 L256 302 L348 146" fill="none" stroke="#FFFFFF" stroke-width="36"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dots 1, 4 and 3. -->
  <g fill="#FFFFFF">
    <circle cx="164" cy="146" r="50"/>
    <circle cx="348" cy="146" r="50"/>
    <circle cx="164" cy="366" r="50"/>
  </g>
</svg>
