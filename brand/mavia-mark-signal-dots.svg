<!--
  MAVIA mark — the signal with its turns marked.

  The same M-as-waveform, with a dot at each place the line changes direction.
  Those four turns are where a reader's finger would find something, and where
  a path would have a node, so the mark carries all three of the product's
  ideas without drawing any of them twice: the letter, the voice, the steps.

  Busier than the plain signal. Worth it on a splash screen, not on a favicon.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MAVIA">
  <title>MAVIA</title>
  <circle cx="256" cy="256" r="256" fill="#1D5FD6"/>
  <path d="M152 368 L152 168 L256 288 L360 168 L360 368"
        fill="none" stroke="#FFFFFF" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
  <g fill="#FFFFFF">
    <circle cx="152" cy="168" r="34"/>
    <circle cx="256" cy="288" r="28"/>
    <circle cx="360" cy="168" r="34"/>
  </g>
</svg>
