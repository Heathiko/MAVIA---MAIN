<!--
  MAVIA mark — a braille M that is also a learning path.

  The same three dots (braille M is 1, 3 and 4), with the step between them
  drawn in. Read one way it is the letter the app is named for. Read the other
  it is what the app actually does: concepts as nodes, joined in the order you
  have to learn them, climbing left to right.

  Both readings are true at once and neither is decoration, which is the only
  kind of visual pun worth using. It is also the one mark no other product
  could take, because no other product's subject is a graph of prerequisites
  written in braille.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MAVIA">
  <title>MAVIA</title>
  <circle cx="256" cy="256" r="256" fill="#1D5FD6"/>
  <!-- the path, behind the nodes so the dots stay whole -->
  <path d="M190 364 L190 148 L322 148" fill="none" stroke="#FFFFFF" stroke-width="22"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  <g fill="#FFFFFF">
    <circle cx="190" cy="364" r="44"/>
    <circle cx="190" cy="148" r="44"/>
    <circle cx="322" cy="148" r="52"/>
  </g>
</svg>
