<!--
  MAVIA mark — the play cell.

  Three dots on the corners of a right-pointing triangle, joined by links, so
  the figure reads as a play button built out of braille. A student presses
  play and hears the lesson; that is the whole product in one shape.

  The honest note: a play triangle's apex is MIDDLE-right, which is braille
  position 5, and dots 1-3-5 spell O rather than M. This mark is braille
  arranged AS a play button, not the letter M. If the letter matters more than
  the button, use mavia-mark-play-m.svg, which keeps a correct M and only
  gestures at play.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MAVIA">
  <title>MAVIA</title>
  <circle cx="256" cy="256" r="256" fill="#1D5FD6"/>
  <!-- links first, so the dots sit on top as whole circles -->
  <path d="M170 142 L170 370 L396 256 Z" fill="none" stroke="#FFFFFF" stroke-width="30"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
  <g fill="#FFFFFF">
    <circle cx="170" cy="142" r="48"/>
    <circle cx="170" cy="370" r="48"/>
    <circle cx="396" cy="256" r="48"/>
  </g>
</svg>
