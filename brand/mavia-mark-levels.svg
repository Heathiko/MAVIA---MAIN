<!--
  MAVIA mark — the level meter that spells M.

  Five bars, the shape every audio app uses, with their heights set so the
  silhouette is the letter: tall, taller, short, taller, tall. It reads as
  sound first and as M a beat later, which is the right order for a product
  whose students hear it before they ever see it.

  The bars are chunky on purpose. At favicon size this is the one mark here
  that loses nothing at all -- five rectangles cannot blur into each other the
  way a thin stroke or an open ring can.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MAVIA">
  <title>MAVIA</title>
  <circle cx="256" cy="256" r="256" fill="#1D5FD6"/>
  <g fill="#FFFFFF">
    <rect x="128" y="232" width="46" height="136" rx="23"/>
    <rect x="192" y="152" width="46" height="216" rx="23"/>
    <rect x="256" y="280" width="46" height="88"  rx="23"/>
    <rect x="320" y="152" width="46" height="216" rx="23"/>
    <rect x="384" y="232" width="46" height="136" rx="23"/>
  </g>
</svg>
