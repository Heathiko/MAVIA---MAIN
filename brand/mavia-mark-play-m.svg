<!--
  MAVIA mark — play, with the letter kept correct.

  Dots 1, 3 and 4: a true braille M. The link between them is turned to point
  right rather than down, so it is a play arrow rather than the letter's
  middle. The cell stays readable as M under a finger, and the chevron carries
  the press-play idea for everyone else.

  It is a softer play button than mavia-mark-play.svg -- dot 4 sits above the
  arrow rather than on it, because braille puts it at the top-right and moving
  it would spell a different letter.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MAVIA">
  <title>MAVIA</title>
  <circle cx="256" cy="256" r="256" fill="#1D5FD6"/>
  <path d="M164 152 L378 256 L164 360" fill="none" stroke="#FFFFFF" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <g fill="#FFFFFF">
    <circle cx="164" cy="146" r="48"/>
    <circle cx="348" cy="146" r="48"/>
    <circle cx="164" cy="366" r="48"/>
  </g>
</svg>
