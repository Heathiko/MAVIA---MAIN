<!--
  MAVIA mark — the same cell with the unraised positions dropped.

  Identical to mavia-mark-cell.svg except that the three open rings are gone.
  They are the first thing to disappear at favicon size, and a ring that is
  half there looks like a printing fault rather than a blank position -- so
  below about 48px this version is the one to use. It is also what braille
  actually looks like on paper, where an unraised dot is simply nothing.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MAVIA">
  <title>MAVIA</title>
  <circle cx="256" cy="256" r="256" fill="#1D5FD6"/>
  <path d="M176 152 L256 292 L336 152" fill="none" stroke="#FFFFFF" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#FFFFFF">
    <circle cx="176" cy="152" r="44"/>
    <circle cx="336" cy="152" r="44"/>
    <circle cx="176" cy="360" r="44"/>
  </g>
</svg>
