  <path d="M164 146 L256 302 L348 146" fill="none" stroke="#FFFFFF" stroke-width="44"
        stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#FFFFFF">
    <circle cx="164" cy="146" r="52"/>
    <circle cx="348" cy="146" r="52"/>
