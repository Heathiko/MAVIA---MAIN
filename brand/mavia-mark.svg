<!--
  MAVIA mark — the braille cell for "M".

  A braille cell is six positions, two columns by three rows, and a letter is
  which of them are raised:

      1  4
      2  5
      3  6

  M is dots 1, 3 and 4. Only raised dots exist on paper, so only those three
  are drawn; the blank positions are blank, exactly as they would be under a
  reader's finger. That is the whole mark — it is the app's own alphabet, and
  it is the letter the app is named for.

  It also survives being small, which matters more here than cleverness: three
  solid shapes at high contrast still read at 32px in a browser tab, where a
  drawn glyph or a wordmark would turn to mud.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MAVIA">
  <title>MAVIA</title>
  <circle cx="256" cy="256" r="256" fill="#1D5FD6"/>
  <g fill="#FFFFFF">
    <!-- dot 1 — top left -->
    <circle cx="190" cy="148" r="46"/>
    <!-- dot 4 — top right -->
    <circle cx="322" cy="148" r="46"/>
    <!-- dot 3 — bottom left -->
    <circle cx="190" cy="364" r="46"/>
  </g>
</svg>
